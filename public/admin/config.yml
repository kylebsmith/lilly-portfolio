# Sveltia CMS v0.207.1 - lillybpatterson.com
# Served from public/admin/ -> /admin/. Sign-in: built-in "Sign in with Token"
# (fine-grained GitHub PAT). No OAuth proxy, no server, no database.
# Lines marked [LB] are load-bearing: each has a specific failure mode if
# changed. Read the handover notes before touching one.

backend:
  name: github
  repo: kylebsmith/lilly-portfolio
  branch: main            # the branch Vercel builds; a commit here is a deploy
  # [LB] Token only. There is no OAuth proxy, so the "Sign In with GitHub"
  # button can never succeed — it sends her to a URL that does not exist.
  # Showing one button that works beats two where the obvious one is broken.
  auth_methods: [token]
  # No base_url/auth_type/app_id - those are for an OAuth proxy or GitHub App.
  # PAT sign-in needs no config at all.
  commit_messages:
    create: 'Add project "{{slug}}"'
    update: 'Update "{{slug}}"'
    delete: 'Remove project "{{slug}}"'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

publish_mode: simple      # no editorial/PR state for this editor to reason about

# The browser tab. Sveltia overwrites index.html's <title> once it boots.
app_title: Lilly Patterson Site Editor

site_url: https://www.lillybpatterson.com
display_url: https://www.lillybpatterson.com

# Fallback only. A global media_folder is REQUIRED when no cloud storage is
# configured; the Projects collection overrides it with entry-relative folders.
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      # [LB] 25 MiB. The previous 10 MiB cap was BELOW her own existing work —
      # 09_book-spots/cover.png is 13 MB — so her first upload would have been
      # rejected with no explanation of what size is acceptable. 25 MiB clears
      # every image currently in the repo and stays well under GitHub's 100 MB
      # hard limit.
      max_file_size: 26214400
      slugify_filename: true    # [LB] filenames become URL segments
      # DELIBERATELY ABSENT: transformations. Re-encoding would strip the
      # EXIF/IPTC/XMP that build-manifest.mjs reads for medium/size/date/blurb.

output:
  # [LB] Deliberately FALSE, and the original rationale for true was wrong.
  #
  # Claimed: an empty `key: ''` would suppress the EXIF fallback and render a
  # blank blurb. Measured: it does not - `medium: ''` and an absent `medium`
  # produce identical output, because build-manifest tests the VALUE for
  # truthiness. (The EXIF fallback is controlled explicitly by the
  # `use_file_details` switch instead.)
  #
  # Meanwhile omitting empty keys actively broke removal. Clearing the images
  # out of a piece wrote an empty list, this dropped the key entirely, and
  # build-manifest reads a MISSING `gallery` as "publish everything on disk" -
  # so emptying the box brought every picture back. Keeping the key means an
  # empty list reads as the empty list it is.
  omit_empty_optional_fields: false
  yaml:
    # [LB] 'none' still auto-quotes anything ambiguous (yes/no/true/12:30/
    # "- 5 in"/"Girl: A Study" all verified to round-trip). Chosen over 'double'
    # because build-manifest keeps a legacy regex fallback that returns values
    # WITH their quote characters; fewer quotes = less it can corrupt.
    # Sole exception, guarded by the `date` pattern below: a bare YYYY-MM-DD is
    # the one shape js-yaml turns into a Date object instead of a string.
    quote: none
    indent_size: 2
    indent_sequences: true
  json:
    indent_style: space
    indent_size: 2

# Slugs become folder names and URL segments; titles here contain em dashes.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: work
    label: Projects
    label_singular: Project
    icon: palette
    description: >-
      Every piece in your portfolio. Drag the rows to change the order they
      appear on the site. The piece at the top is the big one on the homepage.

    # [LB] folder + path -> public/work/<slug>/_meta.txt
    # Generates ^public\/work\/(?<subPath>[^/]+?\/_meta)\.txt$ - matches all 14
    # existing numbered folders, excludes cover.jpg and _manifest.json.
    # `format: yaml` is MANDATORY: without it the 'txt' extension has no mapping
    # and Sveltia falls back to yaml-frontmatter, wrapping files in `---` fences.
    folder: public/work
    path: '{{slug}}/_meta'
    extension: txt
    format: yaml

    create: true
    # Deliberately false. Delete would remove the folder and every image in it
    # in a single commit, with no undo inside the editor. The `hidden` field
    # is the retirement path: it takes a piece off the site and keeps the work.
    # Permanent removal stays a developer action.
    delete: false
    duplicate: false

    # [LB] Drag-and-drop reordering. Renumbers from 1 and writes an `order` key;
    # new entries get max(order)+1 at save. `order` is intentionally NOT in
    # `fields` - it is managed by the reorder UI, written ahead of the declared
    # fields, and (having no field config) can never be stripped by
    # omit_empty_optional_fields.
    reorder: true

    identifier_field: title
    summary: '{{title}}'
    thumbnail: cover

    sortable_fields:
      fields: [title, year, category]
      default: { field: title, direction: ascending }

    view_groups:
      - { name: category, label: Category, field: category }

    # [LB] Entry-relative media. Both MUST be the empty string.
    #   media_folder: '' -> uploads land in this project's own folder,
    #                       e.g. public/work/02_breath-of-life/<file>
    #   public_folder: '' -> the stored value is the BARE FILENAME
    #                       (`cover: cover.jpg`), not a path. '.' would store
    #                       './cover.jpg' instead - don't.
    # build-manifest.mjs joins it back at build time as /work/<folder>/<file>.
    media_folder: ''
    public_folder: ''

    fields:
      - { name: title, label: Title, widget: string }

      # [LB] The four slugs in projects.ts VISIBLE_CATEGORIES. Anything else
      # falls into the hidden "vis-dev" bucket and loses its filter chip.
      - name: category
        label: Category
        widget: select
        default: character-design
        options:
          - { label: Character Design, value: character-design }
          - { label: Environments, value: environments }
          - { label: Book Illustration, value: book-illustration }
          - { label: Sketchbook, value: sketch-book }

      # Required: build-manifest skips any project with no image, so a
      # coverless project would silently vanish from the site.
      # `accept` matches what build-manifest globs - a .psd would upload fine
      # and then be invisible with no error anywhere.
      - name: cover
        label: Cover image
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        choose_url: false
        hint: >-
          The thumbnail for this piece, on the Work page and on the homepage
          if this is the top project. Uploading a corrected version does not
          delete the old file - if you are asked whether to replace or keep
          both, choose Replace, or the old picture stays on the page.

      - name: gallery
        label: More images
        widget: image
        multiple: true
        required: false
        accept: image/jpeg,image/png,image/webp,image/avif
        choose_url: false
        hint: >-
          The order the other images appear on this project's page. Drag to
          reorder them. Taking one out of this list only moves it to the end -
          to remove an image from the site, delete the file itself.

      - { name: year, label: Year, widget: number, value_type: int,
          min: 1990, max: 2100, step: 1, default: 2026 }

      - name: medium
        label: Medium
        widget: string
        required: false
        hint: >-
          e.g. "Digital", "Watercolor". Leave blank to read it from the file's
          Photoshop metadata.

      - name: size
        label: Size
        widget: string
        required: false
        hint: >-
          e.g. "8.6 x 6.5 in". Leave blank to calculate it from the image's
          pixel size and DPI.

      # A string, NOT a datetime: existing files hold prose ("January 2026")
      # and build-manifest prints it verbatim. The pattern blocks a bare
      # YYYY-MM-DD, the one shape js-yaml resolves to a Date object at
      # quote:none. "2026-01" and "2026" are still allowed.
      - name: date
        label: Date
        widget: string
        required: false
        hint: >-
          e.g. "January 2026". Printed as-is. Leave blank to use the date
          stored inside the image file.
        pattern:
          - '^(?!\d{4}-\d{2}-\d{2}$).+'
          - Please write the date in words, like "January 2026".

      # [LB] required: true so omit_empty_optional_fields can never drop this
      # key — if it vanished, the fallback would silently switch back on.
      - name: use_file_details
        label: Fill blank details from the image file
        widget: boolean
        required: true
        default: true
        hint: >-
          Leave this on and the site reads Medium, Size, Date and Description
          out of the picture itself whenever you leave those boxes empty. Turn
          it off to leave them genuinely blank on the page.

      - name: blurb
        label: Description
        widget: text
        required: false
        hint: >-
          A sentence or two. Leave blank to use the description you wrote in
          Photoshop's caption field.

      # Block mappings, not { } flow mappings: a comma inside a flow mapping
      # starts a new key, and these labels contain commas.
      - name: layout
        label: Page layout
        widget: select
        required: false
        default: standard
        options:
          - label: 'Standard - big hero image, then the rest'
            value: standard
          - label: 'Gallery - one even grid, no hero'
            value: gallery

      - name: video
        label: Vimeo link
        widget: string
        required: false
        hint: 'Optional. Paste a Vimeo URL, e.g. https://vimeo.com/123456789'
        pattern:
          - '^https?://(www\.)?vimeo\.com/.+'
          - Please paste a full Vimeo link starting with https://vimeo.com/

      # The retirement mechanism. build-manifest.mjs checks this BEFORE any
      # validation, so switching a piece to Hidden also clears any content
      # error it was raising — it is the universal escape hatch, and the
      # reason hard errors are safe to have at all.
      # Deliberately last: it is the least-used field and should not sit
      # between the ones she edits constantly.
      - name: hidden
        label: Hide from the site
        widget: boolean
        required: false
        default: false
        hint: >-
          Turn this on to take the piece off the website without deleting it.
          Everything is kept and you can turn it back on any time.

      - name: clips
        label: Video files
        widget: file
        multiple: true
        required: false
        accept: video/mp4,video/quicktime,video/webm
        choose_url: false
        hint: >-
          Optional. Short clips shown on the project page. Prefer a Vimeo link
          for anything long - these are committed into the site itself.
        media_libraries:
          default:
            config: { max_file_size: 52428800, slugify_filename: true }

# SITE SETTINGS - READ BEFORE EDITING.
# content/site.ts is TypeScript and Sveltia has no TypeScript format, so it is
# NOT a CMS target. Prose moves to a new JSON file the CMS owns; `url` and `nav`
# stay in TypeScript, where the CMS cannot reach them:
#   content/site-content.json  <- NEW, CMS-owned, exactly the keys below
#   content/site.ts            <- imports that JSON, keeps url + nav as literals
# layout.tsx does new URL(site.url) and sitemap.ts/robots.ts interpolate it;
# nav drives Nav.tsx and Footer.tsx. A blank value there throws at build time.
# JSON not YAML: tsconfig already has resolveJsonModule + content/**/*.json.
# Every field here is REQUIRED on purpose - omit_empty_optional_fields would
# drop an emptied optional key and site.social.map(...) would throw at build.
singletons:
  # Colour controls. Only the accent tones are exposed: they are used for
  # underlines, highlights, buttons, the star mark and hover states, so any
  # value stays legible. Page background and body text are deliberately NOT
  # here — setting those independently is how you get cream text on cream
  # paper, with no way to notice without opening every page.
  # lib/theme.ts validates each value and falls back to the shipped colour.
  - name: look_and_feel
    label: Look & Feel
    file: content/theme.json
    icon: palette
    fields:
      - name: accent
        label: Highlight colour
        widget: color
        default: '#b88a3e'
        hint: >-
          Used for underlines, buttons, the ✦ mark and hover states in
          daytime mode.
      - name: accentGlow
        label: Highlight colour (brighter)
        widget: color
        default: '#e2b865'
        hint: A lighter version of the same colour, used for glows and accents.
      - name: accentDark
        label: Highlight colour — night mode
        widget: color
        default: '#e2b865'
        hint: The same idea, for when someone switches the site to night mode.
      - name: accentGlowDark
        label: Highlight colour — night mode (brighter)
        widget: color
        default: '#f0cc7a'

  - name: site_content
    label: About & Contact
    file: content/site-content.json
    icon: person
    fields:
      - { name: name, label: Your name, widget: string }
      - name: tagline
        label: Tagline
        widget: string
        hint: Shown next to your name in the browser tab and link previews.
      - name: description
        label: Search-engine description
        widget: text
        hint: One sentence. Shown by Google and when a link is shared.
      - name: email
        label: Email
        widget: string
        pattern:
          - '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          - That does not look like an email address

      # `field` (singular) -> stored as a plain string[], which is what
      # site.about.bio maps over. `fields` (plural) would store objects.
      # No `summary`: with a single subfield the value is at bio.0, not
      # bio.0.text, so '{{fields.text}}' would resolve to nothing.
      - name: bio
        label: About paragraphs
        widget: list
        hint: One paragraph per item. Drag to reorder.
        field: { name: text, label: Paragraph, widget: text }

      - { name: location, label: Location, widget: string, hint: 'e.g. Atlanta, GA' }
      - { name: program, label: Program, widget: string,
          hint: 'e.g. MFA Illustration, SCAD Atlanta' }

      - name: social
        label: Social links
        widget: list
        summary: '{{fields.label}}'
        fields:
          - { name: label, label: Name, widget: string }
          - name: href
            label: Link
            widget: string
            pattern: ['^https://.+', 'Links must start with https://']

      # Free text rather than a relation widget: an unmatched slug is already
      # harmless, because featuredProjects() silently skips slugs with no match.
      - name: homeFavorites
        label: Homepage favorites
        widget: list
        hint: >-
          The URL names of the pieces in the "a few favorites" strip, in order.
          A piece's URL name is the part after /work/ in its address.
        field: { name: slug, label: Piece, widget: string }
